{{ if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ .Site.BaseURL }}"
    },
    {{ $sectionPage := .Site.GetPage (printf "%s" .Section) }}
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ $sectionPage.Title }}",
      "item": "{{ $sectionPage.Permalink }}"
    }
    {{ if .Params.version }},
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{ .Params.version }}",
      "item": "{{ .Permalink }}"
    }
    {{ end }}
  ]
}
</script>
{{ end }}
